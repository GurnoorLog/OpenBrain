# ============================================================
# OpenBrain self-hosted stack
# ------------------------------------------------------------
#   docker compose up            -> OpenBrain (Desktop + Runtime) + Ollama
#   docker compose --profile infra up    -> + PostgreSQL, Redis, Qdrant
#   docker compose --profile mcp up      -> + MCP Gateway (local MCP servers)
#   docker compose --profile supabase up -> + Supabase (self-hosted DB/auth)
#
# Services are modular: skip any profile you don't need. Local-first — your
# brains, data, models and keys live in ./workspace and the ollama volume.
# ============================================================

name: openbrain

services:
  # --------------------------------------------------------------------------
  # OpenBrain Runtime — serves the Desktop SPA and executes brains locally.
  # Mounts ./workspace so the Runtime can read/write the user's files, keep a
  # local .brain registry, and run local fine-tunes.
  # --------------------------------------------------------------------------
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbrain-runtime
    ports:
      - "${OPENBRAIN_PORT:-8080}:8080"
    environment:
      - FIREWORKS_API_KEY=${FIREWORKS_API_KEY:-}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY:-}
      - COMPOSIO_ACCOUNT_ID=${COMPOSIO_ACCOUNT_ID:-}
      - COMPOSIO_ENTITY_ID=${COMPOSIO_ENTITY_ID:-}
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./workspace:/workspace
      - ./plugins:/app/plugins:ro
      - ./registry:/workspace/.registry
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Ollama — local models, no API key. OpenBrain switches providers dynamically
  # (Fireworks in the cloud, Ollama locally). Remove this service to stay
  # cloud-only.
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: openbrain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MCP Gateway — hosts local MCP servers (SSE/stdio) for the mcp node type.
  # --------------------------------------------------------------------------
  mcp-gateway:
    build:
      context: ./mcp-gateway
    container_name: openbrain-mcp-gateway
    profiles: ["mcp"]
    ports:
      - "${MCP_GATEWAY_PORT:-9000}:9000"
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Optional data infrastructure (profile: infra)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: openbrain-postgres
    profiles: ["infra"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-openbrain}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openbrain}
      - POSTGRES_DB=${POSTGRES_DB:-openbrain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: openbrain-redis
    profiles: ["infra"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: openbrain-qdrant
    profiles: ["infra"]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Supabase (optional self-hosted, profile: supabase). Runs the database
  # layer; the full stack (Auth/REST/Realtime/Studio) is available from
  # https://supabase.com/docs/guides/self-hosting/docker — add it to your own
  # compose file if you need the managed-Auth experience on-prem.
  # --------------------------------------------------------------------------
  supabase:
    image: supabase/postgres:15.1.1.169
    container_name: openbrain-supabase
    profiles: ["supabase"]
    environment:
      - POSTGRES_PASSWORD=${SUPABASE_DB_PASSWORD:-openbrain}
    ports:
      - "${SUPABASE_DB_PORT:-5433}:5432"
    volumes:
      - supabase:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ollama:
  postgres:
  redis:
  qdrant:
  supabase:
